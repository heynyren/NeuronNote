<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="nn.css">
<style>
  body { width: 372px; max-height: 560px; display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; gap: 9px;
    padding: 12px 14px; border-bottom: 1px solid var(--line);
    background: var(--card); position: sticky; top: 0; z-index: 2;
  }
  header img { width: 22px; height: 22px; border-radius: 6px; }
  header .name { font-size: 13.5px; font-weight: 700; letter-spacing: -.01em; flex: 1; }
  header .count { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .search { padding: 10px 14px 4px; }
  .list { flex: 1; overflow-y: auto; padding: 8px 14px 14px; }
  .row {
    padding: 10px 0; border-bottom: 1px solid var(--line-2); cursor: pointer;
  }
  .row:last-child { border-bottom: 0; }
  .row:hover .ex { color: var(--spark); }
  .ex {
    font-family: var(--serif); font-size: 13.5px; line-height: 1.5; color: var(--ink);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .sub { display: flex; gap: 6px; align-items: center; margin-top: 5px; }
  .sub .site { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .sub .tags { display: flex; gap: 4px; overflow: hidden; }
  footer {
    display: flex; gap: 6px; padding: 10px 14px;
    border-top: 1px solid var(--line); background: var(--card);
  }
  footer button { flex: 1; }
</style>
</head>
<body>
  <header>
    <img src="../icons/icon48.png" alt="">
    <span class="name">Neuron Note</span>
    <span class="count" id="count"></span>
  </header>

  <div class="search">
    <input type="search" id="q" placeholder="Tìm trong đoạn đã lưu, ghi chú, nhãn…" autofocus>
  </div>

  <div class="list" id="list"></div>

  <footer>
    <button id="openAll" class="primary">Mở toàn bộ</button>
    <button id="sync">Đồng bộ</button>
  </footer>

  <div id="toast"></div>
  <script src="../lib/store.js"></script>
  <script src="popup.js"></script>
</body>
</html>
